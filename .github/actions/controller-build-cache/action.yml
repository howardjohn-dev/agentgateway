name: Controller build cache
description: Set up Go and optional Rust toolchains and restore Rust build caches

inputs:
  rust-version:
    description: Rust toolchain version
    required: false
    default: ""
  go-version:
    description: Go toolchain version
    required: true
  save:
    description: Save missing Rust caches after a successful job
    required: false
    default: "false"

runs:
  using: composite
  steps:
  - name: Check runner info
    if: ${{ inputs.rust-version != '' }}
    shell: bash
    run: |
      cat /sys/fs/cgroup/cpu.stat || true
      cat /proc/pressure/cpu || true
      lscpu || true
      openssl speed -seconds 1 -bytes 256 sha256 || true

  - name: Set tools path
    shell: bash
    run: echo "$GITHUB_WORKSPACE/tools" >> "$GITHUB_PATH"

  - name: Set up Rust build cache
    if: ${{ inputs.rust-version != '' }}
    uses: ./.github/actions/rust-build-cache
    with:
      rust-version: ${{ inputs.rust-version }}
      cache-key: controller-e2e-v2
      save: ${{ inputs.save }}

  - name: Install Go
    uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
    with:
      go-version: ${{ inputs.go-version }}
      # Blacksmith provides the Go build cache through its injected GOCACHEPROG.
      # Disable archive caching for both Go modules and build outputs.
      cache: false
