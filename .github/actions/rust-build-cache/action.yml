name: Rust build cache
description: Set up Rust and mount source-aware workspace build artifacts

inputs:
  cache-key:
    description: Cache namespace shared by equivalent jobs
    required: true
  save:
    description: Commit cache changes after a successful job
    required: false
    default: "false"

runs:
  using: composite
  steps:
  - name: Install Rust
    uses: ./.github/actions/setup-rust

  # Cargo primarily uses mtimes for change detection. Stable source mtimes let
  # restored target artifacts remain valid across fresh CI checkouts.
  - name: Restore source mtimes
    shell: bash
    run: |
      python_command=python3
      if ! command -v "$python_command" >/dev/null; then
        python_command=python
      fi
      curl --fail --silent --show-error --location \
        https://raw.githubusercontent.com/howardjohn/git-restore-mtime-action/b77092831982028ae46f86c64831e6e0dde7ee8f/git-restore-mtime |
        "$python_command" - --commit-time

  - name: Locate Cargo home
    if: ${{ runner.os == 'Linux' }}
    id: cargo-home
    shell: bash
    run: echo "path=${CARGO_HOME:-$HOME/.cargo}" >> "$GITHUB_OUTPUT"

  - name: Mount Rust cache
    if: ${{ runner.os == 'Linux' }}
    uses: useblacksmith/stickydisk@3f6be1451e3cad893b778bc93495c80452a5da26 # v1.7.2
    with:
      key: ${{ github.repository }}-rust-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}
      path: .github/rust-cache
      commit: ${{ inputs.save == 'true' && 'on-change' || 'false' }}

  - name: Configure Rust cache paths
    if: ${{ runner.os == 'Linux' }}
    shell: bash
    run: |
      cache_root="$GITHUB_WORKSPACE/.github/rust-cache"
      cargo_home="${{ steps.cargo-home.outputs.path }}"
      mkdir -p "$cache_root/target" "$cache_root/registry" "$cache_root/git" "$cargo_home"
      ln -s "$cache_root/target" target
      ln -s "$cache_root/registry" "$cargo_home/registry"
      ln -s "$cache_root/git" "$cargo_home/git"

  # Post steps run in reverse order, so this cleans the cache before Sticky
  # Disk snapshots it.
  - name: Register Rust cache cleanup
    if: ${{ runner.os == 'Linux' && inputs.save == 'true' }}
    uses: ./.github/actions/rust-build-cache-clean

  - name: Set Rust cache generation
    if: ${{ runner.os == 'Linux' }}
    id: rust-cache-generation
    shell: bash
    run: |
      mkdir -p target/.rust-cache-state

      crates_generation="$(git rev-parse HEAD:crates)"
      {
        echo "commit=$(git rev-parse HEAD)"
        echo "crates=$crates_generation"
      } >> "$GITHUB_OUTPUT"

  # Stable source mtimes can make restored workspace artifacts look current
  # even when they came from a different source revision.
  # Touch every input whose content differs from the commit that wrote the cache
  # so Cargo invalidates the affected artifacts.
  - name: Invalidate changed Rust sources
    if: ${{ runner.os == 'Linux' }}
    shell: bash
    env:
      CURRENT_COMMIT: ${{ steps.rust-cache-generation.outputs.commit }}
      CURRENT_CRATES: ${{ steps.rust-cache-generation.outputs.crates }}
    run: |
      cached_commit="$(cat target/.rust-cache-state/commit 2>/dev/null || true)"
      cached_crates="$(cat target/.rust-cache-state/crates 2>/dev/null || true)"

      echo "Cached Rust commit: ${cached_commit:-missing}"
      echo "Cached crates generation: ${cached_crates:-missing}"
      echo "Current Rust commit: $CURRENT_COMMIT"
      echo "Current crates generation: $CURRENT_CRATES"

      if [[ "$cached_crates" != "$CURRENT_CRATES" ]]; then
        # A fresh disk has no producer-commit marker. Approximate it with the
        # checked-out commit's first parent: for GitHub PR merge refs this is
        # the main revision the PR was tested against.
        if ! [[ "$cached_commit" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${cached_commit}^{commit}"; then
          cached_commit="$(git rev-parse "${CURRENT_COMMIT}^1" 2>/dev/null || true)"
          echo "Approximated cached Rust commit: ${cached_commit:-unavailable}"
        fi

        if [[ "$cached_commit" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${cached_commit}^{commit}"; then
          echo "Rust sources differ from the cached build; touching changed inputs"
          git diff --name-only -z --diff-filter=ACMRTUXB "$cached_commit" "$CURRENT_COMMIT" -- crates |
          while IFS= read -r -d '' changed_file; do
            if [[ -e "$changed_file" ]]; then
              echo "Touching $changed_file"
              touch "./$changed_file"
            fi
          done

          # A deleted input cannot be touched. In that uncommon case invalidate
          # all remaining workspace inputs and let Cargo determine dependencies.
          if ! git diff --quiet --diff-filter=D "$cached_commit" "$CURRENT_COMMIT" -- crates; then
            echo "Rust inputs were deleted; touching the entire workspace"
            git ls-files -z -- crates |
            while IFS= read -r -d '' workspace_file; do
              [[ ! -e "$workspace_file" ]] || touch "./$workspace_file"
            done
          fi
        else
          echo "Cached Rust commit and first parent are unavailable; touching the entire workspace"
          git ls-files -z -- crates |
          while IFS= read -r -d '' workspace_file; do
            [[ ! -e "$workspace_file" ]] || touch "./$workspace_file"
          done
        fi
      else
        echo "Crates generation matches; restored workspace artifacts are current"
      fi

      printf '%s\n' "$CURRENT_COMMIT" > target/.rust-cache-state/commit
      printf '%s\n' "$CURRENT_CRATES" > target/.rust-cache-state/crates
