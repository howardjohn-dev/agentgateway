name: Branch

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

concurrency:
  # GitHub concurrency keeps at most one running and one pending run per group.
  # Use ref_name for PRs so new commits cancel older PR runs on the same PR,
  # but key pushes by SHA so postsubmit runs do not cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref_name) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CI: true
  RUST_VERSION: "1.98.0"
  CARGO_BUILD_WARNINGS: deny
  GO_VERSION: "1.27.1"

jobs:
  controller-e2e:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
        # git-restore-mtime needs full history to find each file's latest change.
        fetch-depth: 0
    - name: Set up controller build caches
      uses: ./.github/actions/controller-build-cache
      with:
        rust-version: "${{ env.RUST_VERSION }}"
        go-version: "${{ env.GO_VERSION }}"
        # PRs can restore the default branch caches, but only postsubmit rolls them forward.
        save: ${{ github.ref == 'refs/heads/main' }}
    - name: Setup
      run: TEST_MODE=e2e ./controller/test/setup/setup-kind-ci.sh
    - name: E2E
      run: |
        CGO_ENABLED=0 PERSIST_INSTALL=true go test -tags=e2e -v ./controller/test/e2e
    - name: Archive bug report directory on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: bug-report
        path: ./controller/_test/bug_report/kind
        retention-days: 2
    - name: Upload cargo timings
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: cargo-timings-e2e
        path: target/cargo-timings/cargo-timing*.html
        retention-days: 2
    - name: Summary
      run: |
        echo '# E2E Timings\n'
        cat controller/_test/ci-step-timings.log >> $GITHUB_STEP_SUMMARY
