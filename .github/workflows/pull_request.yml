name: Branch

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

concurrency:
  # GitHub concurrency keeps at most one running and one pending run per group.
  # Use ref_name for PRs so new commits cancel older PR runs on the same PR,
  # but key pushes by SHA so postsubmit runs do not cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref_name) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CI: true
  CARGO_BUILD_WARNINGS: deny

jobs:
  #### Proxy jobs ####
  proxy-test:
    env:
      # Test binaries do not need debug symbols in CI. In particular, generating
      # and linking MSVC PDBs accounts for a large part of the Windows build.
      CARGO_PROFILE_TEST_DEBUG: 0
      # This target-specific setting has no effect on the Linux and macOS matrix
      # entries. lld-link is bundled with LLVM on the Windows runner and is much
      # faster than the default MSVC linker for these large test executables.
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: lld-link.exe
    strategy:
      matrix:
        include:
        - os: blacksmith-4vcpu-ubuntu-2404
          name: "Proxy Test"
        - os: windows-2025
          name: "Proxy Test (Windows)"
        - os: macos-15
          name: "Proxy Test (Mac)"
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
        # The Rust build cache restores source mtimes from each path's history.
        fetch-depth: 0
    - name: Set up Rust build cache
      uses: ./.github/actions/rust-build-cache
      with:
        cache-key: proxy-test
        # PRs restore the default branch cache; only postsubmit rolls it forward.
        save: ${{ github.ref == 'refs/heads/main' }}
    - name: Start validation dependencies
      if: ${{ startsWith(matrix.os, 'blacksmith-') }}
      run: tools/manage-validation-deps.sh start
    - name: Test
      run: make test
      env:
        KEYCLOAK_AVAILABLE: ${{ startsWith(matrix.os, 'blacksmith-') && '1' || '' }}
        # Generate Cargo's per-crate build report for the artifact below.
        TIMINGS: true
    - name: Upload cargo timings
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: cargo-timings-proxy-test-${{ runner.os }}
        path: target/cargo-timings/cargo-timing*.html
        retention-days: 2
    - name: Stop validation dependencies
      if: ${{ always() && startsWith(matrix.os, 'blacksmith-') }}
      run: tools/manage-validation-deps.sh stop

  proxy-lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
        # The Rust build cache restores source mtimes from each path's history.
        fetch-depth: 0
    - name: Set up Rust build cache
      uses: ./.github/actions/rust-build-cache
      with:
        cache-key: proxy-lint
        # PRs restore the default branch cache; only postsubmit rolls it forward.
        save: ${{ github.ref == 'refs/heads/main' }}
    - name: Generation
      run: make generate-schema check-clean-repo check-default-members
    - name: Lint
      run: make lint
