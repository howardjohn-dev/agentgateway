name: Branch

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"

concurrency:
  # GitHub concurrency keeps at most one running and one pending run per group.
  # Use ref_name for PRs so new commits cancel older PR runs on the same PR,
  # but key pushes by SHA so postsubmit runs do not cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref_name) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CI: true
  CARGO_BUILD_WARNINGS: deny
  GO_VERSION: "1.27.1"

jobs:
  #### Proxy jobs ####
  proxy-test:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    name: Proxy Test
    env:
      # Test binaries do not need debug symbols in CI.
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
        # The Rust build cache restores source mtimes from each path's history.
        fetch-depth: 0
    - name: Set up Rust build cache
      uses: ./.github/actions/rust-build-cache
      with:
        cache-key: proxy-test
        # PRs restore the default branch cache; only postsubmit rolls it forward.
        save: ${{ github.ref == 'refs/heads/main' }}
    - name: Start validation dependencies
      run: tools/manage-validation-deps.sh start
    - name: Test
      run: make test
      env:
        KEYCLOAK_AVAILABLE: 1
        # Generate Cargo's per-crate build report for the artifact below.
        TIMINGS: true
    - name: Upload cargo timings
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: cargo-timings-proxy-test-${{ runner.os }}
        path: target/cargo-timings/cargo-timing*.html
        retention-days: 2
    - name: Stop validation dependencies
      if: ${{ always() }}
      run: tools/manage-validation-deps.sh stop

  proxy-lint:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
        # The Rust build cache restores source mtimes from each path's history.
        fetch-depth: 0
    - name: Set up Rust build cache
      uses: ./.github/actions/rust-build-cache
      with:
        cache-key: proxy-lint
        # PRs restore the default branch cache; only postsubmit rolls it forward.
        save: ${{ github.ref == 'refs/heads/main' }}
    - name: Generation
      run: make generate-schema check-clean-repo check-default-members
    - name: Lint
      run: make lint

  controller-e2e:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
        # git-restore-mtime needs full history to find each file's latest change.
        fetch-depth: 0
    - name: Set up controller toolchains
      uses: ./.github/actions/controller-build-cache
      with:
        rust: "true"
        go-version: "${{ env.GO_VERSION }}"
        # Only postsubmit rolls the Rust build cache forward.
        save: ${{ github.ref == 'refs/heads/main' }}
    - name: Setup
      run: TEST_MODE=e2e ./controller/test/setup/setup-kind-ci.sh
    - name: E2E
      run: |
        CGO_ENABLED=0 PERSIST_INSTALL=true go test -trimpath -tags=e2e,agent,disable_pgv -v ./controller/test/e2e
    - name: Verify Kind images
      if: ${{ always() }}
      run: TEST_MODE=e2e ./controller/test/setup/verify-kind-images.sh
    - name: Archive bug report directory on failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: bug-report
        path: ./controller/_test/bug_report/kind
        retention-days: 2
    - name: Upload cargo timings
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: cargo-timings-e2e
        path: target/cargo-timings/cargo-timing*.html
        retention-days: 2
    - name: Summary
      run: |
        echo '# E2E Timings\n'
        cat controller/_test/ci-step-timings.log >> $GITHUB_STEP_SUMMARY
